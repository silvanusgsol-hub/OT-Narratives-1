<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narrative Quest: Interactive Learning Games</title>
<style>
:root{--ink:#203047;--muted:#5b6b7f;--paper:#f5f7fb;--card:#fff;--accent:#4267d5;--good:#19734a;--bad:#a33b42}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 18px;text-align:center;background:linear-gradient(135deg,#243b65,#526fc4);color:white}
header h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.6rem)}header p{margin:0 auto;max-width:760px}
main{max-width:1000px;margin:24px auto;padding:0 16px 40px}.panel{background:var(--card);border:1px solid #dfe5ef;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #243b650b}
h2,h3{line-height:1.25}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:white;font-weight:650}
button.secondary{background:#e8edf8;color:#263956}button:disabled{cursor:default;opacity:.75}
.unitbtn{text-align:left;min-height:120px}.unitbtn strong{display:block;font-size:1.1rem;margin-bottom:6px}.unitbtn span{font-weight:400}
.meta{color:var(--muted);font-size:.92rem}.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:9px;background:#e6ebf5;border-radius:20px;overflow:hidden;margin:12px 0 18px}.progress div{height:100%;background:#6684e6;width:0;transition:width .2s}
.options{display:grid;gap:9px;margin:16px 0}.option{background:#eef2fa;color:var(--ink);text-align:left;border:2px solid transparent}.option.selected{border-color:var(--accent);background:#e5ebff}.option.correct{border-color:var(--good);background:#e1f5e9}.option.wrong{border-color:var(--bad);background:#ffeaeb}
.feedback{padding:12px 14px;border-radius:12px;background:#f0f3f8;margin:12px 0}.feedback.good{background:#e4f5e9}.feedback.bad{background:#ffeded}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf1fa;color:#253854;padding:8px 12px;border-radius:999px;border:1px solid #d8e0f0;cursor:grab}.chip:active{cursor:grabbing}.dropzone{min-height:54px;padding:12px;border:2px dashed #aab8d3;border-radius:12px;margin:10px 0;background:#fafcff}.dropzone strong{display:block;margin-bottom:7px}.dropzone .chip{display:inline-block;margin:4px}
textarea{width:100%;min-height:110px;border:1px solid #cbd5e5;border-radius:10px;padding:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none}.badge{display:inline-block;border-radius:8px;background:#f0e9ff;color:#543c91;padding:4px 9px;font-size:.85rem;font-weight:700}
@media(max-width:600px){.panel{padding:16px}.unitbtn{min-height:unset}}
</style></head><body>
<header><h1>📜 Narrative Quest</h1><p>Explore biblical narratives through clues, sequencing, matching, choices, puzzles, evidence, story-building, and reflection.</p></header>
<main>
<section id="home" class="panel"><h2>Choose your unit</h2><p class="meta">Each unit contains eight activity styles. Work through the challenges, receive feedback, and earn a unit achievement.</p><div class="units" id="units"></div></section>
<section id="game" class="panel hidden"><div class="topline"><div><span class="badge" id="unitbadge"></span><h2 id="gametitle"></h2></div><div class="meta" id="counter"></div></div><div class="progress"><div id="bar"></div></div><div id="task"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check">Check answer</button><button id="next" class="hidden">Next challenge →</button><button id="homebtn" class="secondary">Unit menu</button></div></section>
<section id="result" class="panel hidden"></section>
</main>
<script>
const units=[{title:"Unit III · Exodus, Conquest, and Settlement",subtitle:"Covenant & Choices",tasks:[
{type:"detective",title:"Detective: The name and the signs",prompt:"In the Exodus narrative, Moses asks about God’s name and then confronts Pharaoh. What connection should a reader explore?",opts:["How divine identity is revealed through the liberation story and signs","How the name is unrelated to the story","How to omit the plagues from interpretation","How Pharaoh becomes the narrator"],correct:0,why:"The unit links Moses, the divine name, the plagues, and liberation."},
{type:"sequence",title:"Sequence: Exodus to Sinai",prompt:"Arrange these major movements.",items:["Moses is called","Moses confronts Pharaoh","Israel is liberated from Egypt","The people arrive at Sinai and receive covenant instruction"],why:"The sequence traces the unit’s movement from Moses’ call through liberation to Sinai."},
{type:"match",title:"Match: Conquest narratives",prompt:"Match each figure or episode to its focus.",pairs:[["Rahab","Hospitality and allegiance in the conquest story"],["Achan","Covenant violation and its consequences"],["Joshua","Leadership in the land narrative"],["Judges cycle","Sin, suffering, cry, deliverance, rest, relapse"]],why:"These connections highlight the unit’s narrative and ethical questions."},
{type:"path",title:"Choose your path: Read ethically",prompt:"A conquest narrative raises a difficult ethical question. What is a responsible interpretive move?",opts:["Name the tension and examine the narrative’s framing and context","Pretend the question does not exist","Make up an episode to settle it","Assume every reader must reach the same easy answer"],correct:0,why:"The unit explicitly includes ethical questions. Responsible reading acknowledges them and works carefully with the text."},
{type:"unlock",title:"Unlock the scroll",prompt:"The recurring pattern in Judges includes sin, suffering, a cry, deliverance, rest, and ____.",answer:"relapse",accept:["relapse","return to sin","relapse into sin"],why:"The cycle repeats, with relapse showing the ongoing failure of covenant faithfulness."},
{type:"evidence",title:"Arrange the evidence",prompt:"Sort the clues into their narrative setting.",groups:[["Exodus and Sinai",["Moses and the divine name","Plagues and liberation"]],["Joshua and Judges",["Rahab and the land","Achan’s violation","The judges cycle"]]],why:"The groups distinguish the Exodus/Sinai story from conquest and settlement narratives."},
{type:"build",title:"Build the unit timeline",prompt:"Choose the sequence that best maps the unit.",opts:["Moses and Exodus → Sinai → Joshua and settlement → Judges","Judges → Sinai → Moses → Joshua","Esther → Exodus → Saul → Abraham","Creation → David → plagues → Ruth"],correct:0,why:"This is the unit’s broad narrative progression."},
{type:"reflect",title:"Reflection: Leadership and covenant",prompt:"In 2–4 sentences, explain what one episode in Exodus, Joshua, or Judges reveals about leadership, covenant, or deliverance.",sample:"A strong answer identifies an episode, names the theme, and explains how the narrative details support that connection."}
]}];
const types={detective:"Narrative Detective",sequence:"Story Sequencer",match:"Theme & Character Matcher",path:"Choose Your Path",unlock:"Unlock the Scroll",evidence:"Arrange the Evidence",build:"Build the Story",reflect:"Reflection Challenge"};
let unitIndex=0,taskIndex=0,score=0,done=false,order=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){ $("home").classList.remove("hidden");$("game").classList.add("hidden");$("result").classList.add("hidden");$("units").innerHTML="";
 units.forEach((u,i)=>{let b=document.createElement("button");b.className="unitbtn";b.innerHTML=`<strong>${u.title}</strong><span>${u.subtitle}</span><p class="meta">8 activity styles · ${u.tasks.length} challenges</p>`;b.onclick=()=>start(i);$("units").appendChild(b)})}
function start(i){unitIndex=i;taskIndex=0;score=0;done=false;$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){done=false;let u=units[unitIndex],t=u.tasks[taskIndex];$("unitbadge").textContent=u.title;$("gametitle").textContent=t.title;$("counter").textContent=`Challenge ${taskIndex+1} of ${u.tasks.length} · ${score} points`;$("bar").style.width=(taskIndex/u.tasks.length*100)+"%";$("feedback").classList.add("hidden");$("feedback").className="feedback hidden";$("check").classList.remove("hidden");$("check").disabled=false;$("next").classList.add("hidden");$("task").innerHTML=`<p class="badge">${types[t.type]}</p><h3>${t.prompt}</h3>`;
 if(t.type==="detective"||t.type==="path"||t.type==="build"){order=shuffle(t.opts.map((_,i)=>i));let d=document.createElement("div");d.className="options";order.forEach((idx,j)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+t.opts[idx];b.onclick=()=>{if(done)return;d.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");b.dataset.pick=j};d.appendChild(b)});$("task").appendChild(d)}
 else if(t.type==="sequence"){order=shuffle(t.items.map((_,i)=>i));let d=document.createElement("div");d.id="sequence";d.className="chips";order.forEach(idx=>{let c=document.createElement("div");c.className="chip";c.draggable=true;c.dataset.id=idx;c.textContent=t.items[idx];c.ondragstart=e=>e.dataTransfer.setData("text/plain",idx);d.appendChild(c)});let z=document.createElement("div");z.className="dropzone";z.id="seqdrop";z.innerHTML="<strong>Drop events here in order (or tap them to move)</strong>";z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData("text/plain"),c=d.querySelector(`[data-id='${id}']`);if(c)z.appendChild(c)};z.onclick=e=>{let c=e.target.closest(".chip");if(c)d.appendChild(c)};$("task").append(d,z);d.onclick=e=>{let c=e.target.closest(".chip");if(c)z.appendChild(c)}}
 else if(t.type==="match"){let d=document.createElement("div");d.className="options";t.pairs.forEach((p,i)=>{let row=document.createElement("div");row.className="panel";row.style.margin="5px 0";row.innerHTML=`<strong>${p[0]}</strong>`;let s=document.createElement("select");s.dataset.pair=i;s.innerHTML='<option value="">Choose a match…</option>'+shuffle(t.pairs.map((x,j)=>j)).map(j=>`<option value="${j}">${t.pairs[j][1]}</option>`).join("");row.appendChild(s);d.appendChild(row)});$("task").appendChild(d)}
 else if(t.type==="unlock"){let inp=document.createElement("input");inp.id="unlockinput";inp.placeholder="Type your answer";inp.style.width="100%";inp.style.padding="12px";inp.style.borderRadius="10px";inp.style.border="1px solid #cbd5e5";$("task").appendChild(inp)}
 else if(t.type==="evidence"){let d=document.createElement("div");t.groups.forEach((g,i)=>{let z=document.createElement("div");z.className="dropzone";z.dataset.group=i;z.innerHTML=`<strong>${g[0]}</strong>`;z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let c=document.getElementById(e.dataTransfer.getData("text/plain"));if(c)z.appendChild(c)};d.appendChild(z)});let pool=document.createElement("div");pool.className="chips";let all=t.groups.flatMap((g,i)=>g[1].map((v,j)=>({v,correct:i})));shuffle(all).forEach((x,i)=>{let c=document.createElement("div");c.className="chip";c.draggable=true;c.id="ev"+i;c.dataset.correct=x.correct;c.textContent=x.v;c.ondragstart=e=>e.dataTransfer.setData("text/plain",c.id);pool.appendChild(c)});d.appendChild(pool);$("task").appendChild(d)}
 else if(t.type==="reflect"){let ta=document.createElement("textarea");ta.id="reflection";ta.placeholder="Write your short reflection here…";$("task").appendChild(ta);let sample=document.createElement("p");sample.className="meta";sample.textContent="Your response is for practice. After checking, compare it with the model response."; $("task").appendChild(sample)}
}
function check(){if(done)return;let t=units[unitIndex].tasks[taskIndex],good=false,explain=t.why||"";
 if(["detective","path","build"].includes(t.type)){let pick=document.querySelector(".option.selected");if(!pick){alert("Choose an answer first.");return}let display=[...document.querySelectorAll(".option")].indexOf(pick),chosen=order[display];good=chosen===t.correct;document.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;if(order[i]===t.correct)b.classList.add("correct");else if(b===pick)b.classList.add("wrong")})}
 if(t.type==="sequence"){let z=[...$("seqdrop").querySelectorAll(".chip")].map(c=>+c.dataset.id);if(z.length!==t.items.length){alert("Move every event into the order area first.");return}good=z.every((v,i)=>v===i);explain+=" Correct order: "+t.items.join(" → ")+ "."}
 if(t.type==="match"){let sels=[...document.querySelectorAll("select[data-pair]")];if(sels.some(s=>s.value==="")){alert("Complete every match first.");return}good=sels.every(s=>+s.value===+s.dataset.pair)}
 if(t.type==="unlock"){let v=$("unlockinput").value.trim().toLowerCase();if(!v){alert("Type an answer first.");return}good=[t.answer,...(t.accept||[])].some(a=>v===a.toLowerCase())}
 if(t.type==="evidence"){let chips=[...document.querySelectorAll(".chip[data-correct]")];if(chips.some(c=>!c.parentElement.dataset.group)){alert("Place every clue into a category first.");return}good=chips.every(c=>+c.parentElement.dataset.group===+c.dataset.correct)}
 if(t.type==="reflect"){let v=$("reflection").value.trim();if(v.length<15){alert("Write a little more before checking (at least 15 characters).");return}good=true;explain="Reflection practice completed. Compare your response with this model: "+t.sample}
 done=true;if(good)score++;$("counter").textContent=`Challenge ${taskIndex+1} of ${units[unitIndex].tasks.length} · ${score} points`;$("feedback").classList.remove("hidden");$("feedback").classList.add(good?"good":"bad");$("feedback").innerHTML=`<strong>${good?(t.type==="reflect"?"Response recorded!":"Correct!"):"Not quite yet."}</strong><p>${explain}</p>`;$("check").classList.add("hidden");$("next").classList.remove("hidden");$("next").textContent=taskIndex===units[unitIndex].tasks.length-1?"See unit results":"Next challenge →"}
function next(){if(taskIndex<units[unitIndex].tasks.length-1){taskIndex++;render()}else results()}
function results(){let pct=Math.round(score/units[unitIndex].tasks.length*100),rank=pct===100?"🏆 Story Scholar":pct>=80?"🌟 Narrative Navigator":pct>=60?"🧭 Theme Tracker":"📚 Apprentice Reader";$("game").classList.add("hidden");$("result").classList.remove("hidden");$("result").innerHTML=`<h2>Unit complete!</h2><p>${units[unitIndex].title}</p><h3>${score} / ${units[unitIndex].tasks.length} · ${pct}%</h3><p style="font-size:1.3rem">${rank}</p><p>Reflection challenges count as completed when you submit a thoughtful response. Keep exploring the narrative details and themes.</p><div class="actions"><button onclick="start(${unitIndex})">Replay this unit</button><button class="secondary" onclick="home()">Choose another unit</button></div>`}
$("check").onclick=check;$("next").onclick=next;$("homebtn").onclick=home;home();
</script></body></html>
